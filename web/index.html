<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="view-home" class="view home" data-view="home">
    <h1>Bienvenido</h1>
    <p class="home-sub">Elige qué quieres hacer</p>
    <nav class="home-cards" aria-label="Navegación principal">
      <a id="nav-calculator" class="card" href="#/calculator" data-nav="calculator">
        <span class="card-icon" aria-hidden="true">🧮</span>
        <span class="card-title">Calculadora</span>
        <span class="card-desc">Con panel de historial integrado</span>
        <span class="badge">🕘 Historial</span>
      </a>
      <a id="nav-flappy" class="card" href="#/flappy" data-nav="flappy">
        <span class="card-icon" aria-hidden="true">🐦</span>
        <span class="card-title">Flappy Bird</span>
        <span class="card-desc">Mini-juego con récord guardado</span>
      </a>
    </nav>
  </section>
  <div class="layout">
  <div id="view-calculator" class="view" data-view="calculator" hidden>
  <a class="back" href="#/" data-nav="home">← Volver al inicio</a>
  <div class="calc-layout">
  <div class="calc-layout">
  <main class="calculator">
    <button id="theme-toggle" class="theme" type="button" aria-label="Cambiar tema">◐</button>
    <section class="display" aria-live="polite">
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </section>
    <section class="keys">
      <button type="button" data-action="clear" class="ctrl">C</button>
      <button type="button" data-key="/" class="op">/</button>
      <button type="button" data-key="*" class="op">*</button>
      <button type="button" data-key="-" class="op">-</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" data-key="+" class="op">+</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-action="equals" class="equals">=</button>
      <button type="button" data-key="0" class="zero">0</button>
      <button type="button" data-key=".">.</button>
    </section>
  </main>
  <aside id="history-panel" class="history" aria-label="Historial de cálculos">
    <div class="history-head">
      <h2>Historial</h2>
      <button id="history-toggle" type="button" class="history-toggle" aria-label="Mostrar u ocultar historial">🕘</button>
    </div>
    <div class="history-body">
      <p id="history-empty" class="history-empty">Sin cálculos todavía</p>
      <ul id="history-list" class="history-list"></ul>
      <button id="history-clear" type="button" class="history-clear">Limpiar historial</button>
    </div>
  </aside>
  </div>
  </div>
  <div id="view-flappy" class="view" data-view="flappy" hidden>
  <a class="back" href="#/" data-nav="home">← Volver al inicio</a>
  <aside class="flappy" aria-label="Mini-juego Flappy Bird">
    <h2>Flappy Bird</h2>
    <canvas id="flappy-canvas" width="320" height="440" aria-label="Lienzo del juego"></canvas>
    <div class="flappy-info">
      <span>Puntos: <strong id="flappy-score">0</strong></span>
      <span>Récord: <strong id="flappy-best">0</strong></span>
    </div>
    <button id="flappy-start" type="button" class="flappy-btn">Jugar</button>
  </aside>
  </div>
  </div>
  <script src="router.js"></script>
  <script src="calculator.js"></script>
  <script src="flappy.js"></script>
</body>
</html>
